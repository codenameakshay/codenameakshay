name: Refresh README
on:
  schedule:
    # Runs once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme

jobs:
  refresh:
    name: Refresh the Writing list and the animated cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # commits and pushes on its own; a Medium outage must not block the card refresh
      - uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true
        with:
          feed_list: "https://medium.com/feed/@codenameakshay"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/cards/build.py --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards scripts/cards/live.json
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore: refresh cards with live numbers"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
